name: StreamMix CI/CD Multi-Platform Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── macOS Build & Packaging (.dmg) ───────────────────────────
  build-macos:
    name: macOS (Universal .dmg)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install qt@6 ffmpeg portaudio srt create-dmg ninja cmake pkg-config
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix ffmpeg)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build StreamMix
        run: cmake --build build --config Release

      - name: Run Master Integration Test Suite
        run: |
          clang++ -std=c++20 -Ilibstreammix/include -Ilibstreammix/src \
            libstreammix/src/core/context.cpp \
            libstreammix/src/core/data_source.cpp \
            libstreammix/src/core/preset_manager.cpp \
            libstreammix/src/capture/source.cpp \
            libstreammix/src/capture/title_source.cpp \
            libstreammix/src/compositor/compositor.cpp \
            libstreammix/src/audio/audio_mixer.cpp \
            libstreammix/src/audio/audio_dsp.cpp \
            libstreammix/src/control/control_surface.cpp \
            libstreammix/src/control/ptz_controller.cpp \
            libstreammix/src/replay/instant_replay.cpp \
            libstreammix/src/output/record_output.cpp \
            libstreammix/src/output/stream_manager.cpp \
            libstreammix/src/output/rtmp_output.cpp \
            libstreammix/src/output/multicorder.cpp \
            libstreammix/src/output/virtual_cam.cpp \
            tests/test_master_suite.cpp \
            -L"$(brew --prefix ffmpeg)/lib" \
            -Wl,-rpath,"$(brew --prefix ffmpeg)/lib" \
            -lavcodec -lavformat -lavutil -lswscale -lswresample \
            -o test_master_runner && ./test_master_runner

      - name: Package macOS DMG
        run: ./scripts/package_macos.sh Release

      - name: Upload macOS Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: StreamMix-macOS-DMG
          path: dist/macos/*.dmg

  # ─── Windows Build & Packaging (.msi) ─────────────────────────
  build-windows:
    name: Windows x64 (.msi)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH
          } else {
            choco install wixtoolset -y
          }

      - name: Install Qt6 via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 -O "C:\Qt"
          echo "Qt6_DIR=C:\Qt\6.6.3\msvc2019_64\lib\cmake\Qt6" >> $env:GITHUB_ENV
          echo "C:\Qt\6.6.3\msvc2019_64\bin" >> $env:GITHUB_PATH

      - name: Install FFmpeg Shared (Windows x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg_dir"
          $ffmpegRoot = (Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg_dir" -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          echo "$ffmpegRoot\bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;$env:FFMPEG_DIR" `
            -DCPACK_GENERATOR="WIX"

      - name: Build StreamMix
        run: cmake --build build --config Release --parallel

      - name: Package Windows Deliverables
        shell: pwsh
        run: .\scripts\package_windows.ps1 -BuildType Release -Arch x64

      - name: Upload Windows Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: StreamMix-Windows-x64
          path: dist/windows/*

  # ─── Linux Build & Packaging (.AppImage) ──────────────────────
  build-linux:
    name: Linux x86_64 (.AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools libgl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavdevice-dev portaudio19-dev libsrt-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build StreamMix
        run: cmake --build build --config Release

      - name: Run Master Integration Test Suite
        run: |
          g++ -std=c++20 -Ilibstreammix/include -Ilibstreammix/src \
            libstreammix/src/core/context.cpp \
            libstreammix/src/core/data_source.cpp \
            libstreammix/src/core/preset_manager.cpp \
            libstreammix/src/capture/source.cpp \
            libstreammix/src/capture/title_source.cpp \
            libstreammix/src/compositor/compositor.cpp \
            libstreammix/src/audio/audio_mixer.cpp \
            libstreammix/src/audio/audio_dsp.cpp \
            libstreammix/src/control/control_surface.cpp \
            libstreammix/src/control/ptz_controller.cpp \
            libstreammix/src/replay/instant_replay.cpp \
            libstreammix/src/output/record_output.cpp \
            libstreammix/src/output/stream_manager.cpp \
            libstreammix/src/output/rtmp_output.cpp \
            libstreammix/src/output/multicorder.cpp \
            libstreammix/src/output/virtual_cam.cpp \
            tests/test_master_suite.cpp \
            -lavcodec -lavformat -lavutil -lswscale -lswresample \
            -o test_master_runner && ./test_master_runner

      - name: Package Linux AppImage
        run: ./scripts/package_linux.sh Release

      - name: Upload Linux Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: StreamMix-Linux-AppImage
          path: dist/linux/*.AppImage

  # ─── GitHub Release on Tags ───────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [ build-macos, build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StreamMix-macOS-DMG/*
            StreamMix-Windows-x64/*
            StreamMix-Linux-AppImage/*
          generate_release_notes: true
          draft: false
          prerelease: false
